# Página pública "Entre Nós" — mesmo app Node, servido pelo domínio próprio.
# Depois de apontar o DNS (registros A de entrenos e www.entrenos para a VPS), rode:
#   certbot --nginx -d entrenos.papernow.com.br -d www.entrenos.papernow.com.br
server {
    listen 80;
    listen [::]:80;
    server_name entrenos.papernow.com.br www.entrenos.papernow.com.br;

    client_max_body_size 320M;           # materiais/vídeos enviados pelo painel

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
